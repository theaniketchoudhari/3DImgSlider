<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width,user-scalable=no"
  />

  <title>Saniya♥️..</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      touch-action: none;
    }


    body {
      overflow: hidden;

      background: #111;

      display: flex;

      -webkit-perspective: 1000px;
      perspective: 1000px;

      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }



    /* =====================================================
       TAP TO ENTER SCREEN
       ===================================================== */

    #intro-screen {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #3b0b2f 0%,
          #160916 45%,
          #050505 100%
        );

      transition:
        opacity 1s ease,
        visibility 1s ease;
    }


    #intro-screen.hide {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }



    /* Glow */

    #intro-screen::before {

      content: "";

      position: absolute;

      width: 350px;

      height: 350px;

      border-radius: 50%;

      background:
        rgba(255, 70, 160, 0.15);

      filter: blur(70px);

      animation:
        glow 3s ease-in-out infinite alternate;
    }


    @keyframes glow {

      from {

        transform: scale(0.9);

        opacity: 0.5;
      }

      to {

        transform: scale(1.2);

        opacity: 1;
      }

    }



    /* Intro Content */

    .intro-content {

      position: relative;

      z-index: 2;

      text-align: center;

      color: white;

      padding: 30px;
    }



    /* Heart */

    .intro-heart {

      font-size: 70px;

      margin-bottom: 20px;

      animation:
        heartbeat 1.4s infinite;

      filter:
        drop-shadow(
          0 0 15px
          rgba(255, 80, 160, 0.8)
        );
    }


    @keyframes heartbeat {

      0% {
        transform: scale(1);
      }

      25% {
        transform: scale(1.12);
      }

      40% {
        transform: scale(1);
      }

      60% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }



    /* Title */

    .intro-title {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(32px, 7vw, 60px);

      font-weight: 500;

      letter-spacing: 2px;

      margin-bottom: 12px;

      text-shadow:
        0 0 10px
        rgba(255,255,255,0.3),

        0 0 25px
        rgba(255,80,160,0.4);
    }



    /* Subtitle */

    .intro-subtitle {

      font-family:
        Arial,
        sans-serif;

      font-size: 15px;

      letter-spacing: 2px;

      color:
        rgba(255,255,255,0.7);

      margin-bottom: 35px;
    }



    /* Enter Button */

    #enter-btn {

      position: relative;

      border: none;

      outline: none;

      cursor: pointer;

      padding:
        15px 38px;

      border-radius: 50px;

      color: white;

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 1.5px;

      background:
        linear-gradient(
          135deg,
          #ff4f9a,
          #b72cff
        );

      box-shadow:
        0 8px 30px
        rgba(255, 60, 160, 0.35);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    #enter-btn:hover {

      transform:
        translateY(-3px)
        scale(1.04);

      box-shadow:
        0 12px 40px
        rgba(255, 60, 160, 0.55);
    }


    #enter-btn:active {

      transform: scale(0.96);
    }



    /* Small Text */

    .tap-text {

      margin-top: 18px;

      font-family:
        Arial,
        sans-serif;

      font-size: 11px;

      letter-spacing: 1px;

      color:
        rgba(255,255,255,0.45);
    }



    /* =====================================================
       3D GALLERY
       ===================================================== */

    #drag-container,
    #spin-container {

      position: relative;

      display: flex;

      margin: auto;

      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;

      -webkit-transform:
        rotateX(-10deg);

      transform:
        rotateX(-10deg);
    }



    #drag-container img,
    #drag-container video {

      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;

      position: absolute;

      left: 0;

      top: 0;

      width: 100%;

      height: 100%;

      line-height: 200px;

      font-size: 50px;

      text-align: center;

      -webkit-box-shadow:
        0 0 8px #fff;

      box-shadow:
        0 0 8px #fff;

      -webkit-box-reflect:
        below 10px
        linear-gradient(
          transparent,
          transparent,
          #0005
        );
    }



    #drag-container img:hover,
    #drag-container video:hover {

      -webkit-box-shadow:
        0 0 15px #fffd;

      box-shadow:
        0 0 15px #fffd;

      -webkit-box-reflect:
        below 10px
        linear-gradient(
          transparent,
          transparent,
          #0007
        );
    }



    #drag-container p {

      font-family: Serif;

      position: absolute;

      top: 100%;

      left: 50%;

      -webkit-transform:
        translate(-50%, -50%)
        rotateX(90deg);

      transform:
        translate(-50%, -50%)
        rotateX(90deg);

      color: #fff;
    }



    /* Ground */

    #ground {

      width: 900px;

      height: 900px;

      position: absolute;

      top: 100%;

      left: 50%;

      -webkit-transform:
        translate(-50%, -50%)
        rotateX(90deg);

      transform:
        translate(-50%, -50%)
        rotateX(90deg);

      background:
        -webkit-radial-gradient(
          center center,
          farthest-side,
          #9993,
          transparent
        );

      background:
        radial-gradient(
          circle,
          #9993,
          transparent
        );
    }



    /* =====================================================
       MUSIC
       ===================================================== */

    #music-container {

      position: fixed;

      width: 0;

      height: 0;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;
    }



    /* =====================================================
       SPIN
       ===================================================== */

    @-webkit-keyframes spin {

      from {

        -webkit-transform:
          rotateY(0deg);

        transform:
          rotateY(0deg);
      }

      to {

        -webkit-transform:
          rotateY(360deg);

        transform:
          rotateY(360deg);
      }

    }


    @keyframes spin {

      from {

        transform:
          rotateY(0deg);
      }

      to {

        transform:
          rotateY(360deg);
      }

    }



    @-webkit-keyframes spinRevert {

      from {

        -webkit-transform:
          rotateY(360deg);

        transform:
          rotateY(360deg);
      }

      to {

        -webkit-transform:
          rotateY(0deg);

        transform:
          rotateY(0deg);
      }

    }


    @keyframes spinRevert {

      from {

        transform:
          rotateY(360deg);
      }

      to {

        transform:
          rotateY(0deg);
      }

    }



    /* =====================================================
       INSTAGRAM BUTTON
       ===================================================== */

    .instagram-corner {

      position: fixed;

      top: 20px;

      right: 20px;

      z-index: 9999;

      text-decoration: none;

      color: white;
    }



    .instagram-box {

      display: flex;

      align-items: center;

      gap: 8px;

      padding:
        9px 14px;

      border-radius: 25px;

      background:
        rgba(0, 0, 0, 0.55);

      border:
        1px solid
        rgba(255, 255, 255, 0.25);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.35);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }



    .instagram-box:hover {

      transform:
        scale(1.06);

      background:
        rgba(0, 0, 0, 0.75);

      box-shadow:
        0 8px 30px
        rgba(255, 80, 160, 0.35);
    }



    /* Instagram Logo */

    .instagram-logo {

      width: 25px;

      height: 25px;

      fill: none;

      stroke: white;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;
    }



    .instagram-logo .instagram-dot {

      fill: white;

      stroke: none;
    }



    .instagram-box span {

      font-family:
        Arial,
        sans-serif;

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 0.3px;

      white-space: nowrap;
    }



    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 500px) {

      .instagram-corner {

        top: 12px;

        right: 12px;
      }


      .instagram-box {

        padding:
          8px 11px;
      }


      .instagram-logo {

        width: 23px;

        height: 23px;
      }


      .instagram-box span {

        font-size: 11px;
      }

    }

  </style>

</head>



<body>


  <!-- =====================================================
       TAP TO ENTER
       ===================================================== -->

  <div id="intro-screen">

    <div class="intro-content">

      <div class="intro-heart">
        ❤️
      </div>


      <div class="intro-title">

      </div>


      <div class="intro-subtitle">

      </div>


      <button id="enter-btn">
        💗 Tap to Enter 💗
      </button>


      <div class="tap-text">

      </div>

    </div>

  </div>



  <!-- =====================================================

       ===================================================== -->

  <div id="drag-container">

    <div id="spin-container">


      <!-- IMAGE 1 -->

      <img
        src="https://iili.io/C4N3hCB.md.png"

      />


      <!-- IMAGE 2 -->

      <img

      <img

      />


      <!-- IMAGE 5 -->

      <img
        src="https://iili.io/C4NfLa1.md.png"

      />


      <!-- IMAGE 6 -->

      <img
        src="https://iili.io/C4NqGcP.md.png"

      />


      <!-- VIDEO -->

      <video
        controls
        autoplay
        loop
      >

        <source
          src="https://player.vimeo.com/external/322244668.sd.mp4?s=338c48ac2dfcb1d4c0689968b5baf94eee6ca0c1&profile_id=165&oauth2_token_id=57447761"
          type="video/mp4"
        />

      </video>


      <!-- CENTER TEXT -->

  <!-- =====================================================

       ===================================================== -->

  <div id="music-container"></div>



  <!-- =====================================================

       ===================================================== -->

  <a
    href="https://www.instagram.com/theaniketchoudhari"
    target="_blank"
    rel="noopener noreferrer"
    class="instagram-corner"
    aria-label="Instagram - theaniketchoudhari"
  >

    <div class="instagram-box">


      <!-- Instagram SVG Logo -->

      <svg
        class="instagram-logo"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <rect
          x="2"

        ></rect>


        <circle
          cx="12"

        ></circle>

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       3D SETTINGS
       ===================================================== */

    var radius = 240;

    var autoRotate = true;

    var rotateSpeed = -60;

    var imgWidth = 120;

    var imgHeight = 170;



    /* =====================================================
       HOSTED FALAK TAK MUSIC
       ===================================================== */

    var bgMusicURL =
      "https://www.image2url.com/r2/default/audio/1786303067831-623f57c4-3a23-4b11-bdf2-55f8b38000d1.mp3";



    /* =====================================================
       ELEMENTS
       ===================================================== */

    var odrag =
      document.getElementById(
        "drag-container"
      );


    var ospin =
      document.getElementById(
        "spin-container"
      );


    var aImg =
      ospin.getElementsByTagName(
        "img"
      );


    var aVid =
      ospin.getElementsByTagName(
        "video"
      );


    var aEle =
      [...aImg, ...aVid];



    /* =====================================================
       IMAGE SIZE
       ===================================================== */

    ospin.style.width =
      imgWidth + "px";


    ospin.style.height =
      imgHeight + "px";



    /* =====================================================
       GROUND
       ===================================================== */

    var ground =
      document.getElementById(
        "ground"
      );


    ground.style.width =
      radius * 3 + "px";


    ground.style.height =
      radius * 3 + "px";



    /* =====================================================
       INITIALIZE GALLERY
       ===================================================== */

    function init(delayTime) {

      for (
        var i = 0;
        i < aEle.length;
        i++
      ) {

        aEle[i].style.transform =
          "rotateY(" +
          i *
            (360 / aEle.length) +
          "deg) translateZ(" +
          radius +
          "px)";


        aEle[i].style.transition =
          "transform 1s";


        aEle[i].style.transitionDelay =
          delayTime ||
          (aEle.length - i) / 4 +
            "s";

      }

    }



    /* =====================================================
       TRANSFORM
       ===================================================== */

    function applyTranform(obj) {

      if (tY > 180) {

        tY = 180;

      }


      if (tY < 0) {

        tY = 0;

      }


      obj.style.transform =
        "rotateX(" +
        -tY +
        "deg) rotateY(" +
        tX +
        "deg)";

    }



    /* =====================================================
       PLAY / PAUSE SPIN
       ===================================================== */

    function playSpin(yes) {

      ospin.style.animationPlayState =
        yes
          ? "running"
          : "paused";

    }



    /* =====================================================
       DRAG VARIABLES
       ===================================================== */

    var sX,
      sY,
      nX,
      nY,
      desX = 0,
      desY = 0,
      tX = 0,
      tY = 10;



    /* =====================================================
       AUTO ROTATION
       ===================================================== */

    if (autoRotate) {

      var animationName =
        rotateSpeed > 0
          ? "spin"
          : "spinRevert";


      ospin.style.animation =
        `${animationName} ${
          Math.abs(rotateSpeed)
        }s infinite linear`;

    }



    /* =====================================================
       CREATE MUSIC
       ===================================================== */

    var audio =
      document.createElement(
        "audio"
      );


    audio.id =
      "background-music";


    audio.src =
      bgMusicURL;


    audio.loop = true;


    audio.preload = "auto";


    audio.volume = 1.0;


    audio.controls = false;


    audio.setAttribute(
      "playsinline",
      ""
    );


    document
      .getElementById(
        "music-container"
      )
      .appendChild(audio);



    /* =====================================================
       TAP TO ENTER
       ===================================================== */

    var introScreen =
      document.getElementById(
        "intro-screen"
      );


    var enterButton =
      document.getElementById(
        "enter-btn"
      );


    enterButton.addEventListener(
      "click",
      function () {


        /* Start music */

        audio
          .play()
          .then(
            function () {

              console.log(
                "🎵 Falak Tak started!"
              );

            }
          )
          .catch(
            function (error) {

              console.log(
                "Music error:",
                error
              );

            }
          );



        /* Hide intro */

        introScreen.classList.add(
          "hide"
        );



        /* Start gallery */

        setTimeout(
          function () {

            init(0);

          },
          100
        );

      }
    );



    /* =====================================================
       POINTER DRAG
       ===================================================== */

    document.onpointerdown =
      function (e) {

        clearInterval(
          odrag.timer
        );


        e =
          e ||
          window.event;


        var startX =
          e.clientX;


        var startY =
          e.clientY;



        this.onpointermove =
          function (e) {

            e =
              e ||
              window.event;


            var currentX =
              e.clientX;


            var currentY =
              e.clientY;



            desX =
              currentX - startX;


            desY =
              currentY - startY;



            tX +=
              desX * 0.1;


            tY +=
              desY * 0.1;



            applyTranform(
              odrag
            );



            startX =
              currentX;


            startY =
              currentY;

          };



        this.onpointerup =
          function () {


            odrag.timer =
              setInterval(
                function () {


                  desX *= 0.95;


                  desY *= 0.95;


                  tX +=
                    desX * 0.1;


                  tY +=
                    desY * 0.1;


                  applyTranform(
                    odrag
                  );


                  playSpin(false);



                  if (
                    Math.abs(
                      desX
                    ) < 0.5 &&
                    Math.abs(
                      desY
                    ) < 0.5
                  ) {


                    clearInterval(
                      odrag.timer
                    );


                    playSpin(true);

                  }

                },
                17
              );



            this.onpointermove =
              this.onpointerup =
              null;

          };


        return false;

      };



    /* =====================================================
       MOUSE WHEEL
       ===================================================== */

    document.onmousewheel =
      function (e) {


        e =
          e ||
          window.event;


        var d =
          e.wheelDelta / 20 ||
          -e.detail;


        radius += d;


        init(1);

      };



    /* =====================================================
       INITIAL SETUP
       ===================================================== */

    setTimeout(
      function () {

        init(100);

      },
      100
    );

  </script>


</body>

</html>
